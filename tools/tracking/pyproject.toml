[project]
name = "trevo-tracking"
version = "0.1.0"
description = "Contrato de tracking (PostHog + Hotmart) do Microteste Comercial 01 -- gera a config publica e faz QA local, sem dependencia de rede."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
