[project]
name = "trevo-pagespeed"
version = "0.1.0"
description = "Ferramenta local, extraivel, para baseline de performance via PageSpeed Insights API v5 + CrUX API."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
pagespeed-tool = "trevo_pagespeed.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
