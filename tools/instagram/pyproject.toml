[project]
name = "trevo-instagram"
version = "0.1.0"
description = "Adaptador local, extraivel, para a Instagram API (Instagram API with Instagram Login)."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
instagram-tool = "trevo_instagram.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
