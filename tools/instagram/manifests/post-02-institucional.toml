# Manifesto declarativo do Post 2 (institucional). Sem segredos aqui --
# access_token/ig_user_id vem sempre de variaveis de ambiente (.env).
#
# media_url fica vazio de proposito nesta etapa: a branch que contem
# assets/social/ ainda nao foi mesclada/publicada, entao a URL abaixo
# ainda NAO existe publicamente. Preencher (ou usar --media-url quando
# esse suporte existir) somente depois do merge + deploy, e depois de
# confirmar HTTP 200 + content-type correto nessa URL.
#
# URL publica esperada apos merge/deploy:
#   https://trevodigitalconversoes.github.io/assets/social/post-02-institucional.jpg

schema_version = 1

[account]
name = "trevo-digital-conversoes"

[post]
type = "image"
asset_path = "../../../assets/social/post-02-institucional.jpg"
caption_file = "post-02-institucional.caption.txt"
alt_text = "Banner institucional da Trevo Digital Conversões, fundo verde escuro com a logo da marca, o texto Marketing digital, Afiliados, Curadoria e o nome Trevo Digital Conversões."
media_url = ""
